    <script>
        // ===== Countdown Timer =====
        const TARGET_TIME = new Date('2026-03-20T15:40:00+09:00').getTime();
        const timerEl = document.getElementById('countdownTimer');
        const labelEl = document.querySelector('.countdown-label');

        function updateCountdown() {
            const now = Date.now();
            const diff = TARGET_TIME - now;

            if (diff <= 0) {
                labelEl.textContent = '결과 발표';
                timerEl.textContent = '조회 가능';
                timerEl.classList.add('ended');
                return;
            }

            const hours = Math.floor(diff / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            timerEl.textContent = `${String(hours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);

        // ===== Entry Animation =====
        document.addEventListener('DOMContentLoaded', () => {
            const hero = document.getElementById('heroSection');
            const banner = document.getElementById('blueBanner');

            anime({
                targets: hero,
                opacity: [0, 1],
                scale: [0.96, 1],
                duration: 900,
                delay: 100,
                easing: 'easeOutCubic',
            });

            // Countdown fade in
            anime({
                targets: '.hero-countdown',
                opacity: [0, 1],
                translateY: [20, 0],
                duration: 800,
                delay: 300,
                easing: 'easeOutCubic',
            });

            anime({
                targets: banner,
                opacity: [0, 1],
                translateY: [30, 0],
                duration: 800,
                delay: 400,
                easing: 'easeOutCubic',
            });

            anime({
                targets: [document.getElementById('btnResult'), document.getElementById('btnHome')],
                opacity: [0, 1],
                translateY: [12, 0],
                duration: 500,
                delay: anime.stagger(120, { start: 700 }),
                easing: 'easeOutQuad',
            });

            anime({
                targets: '.banner-title, .banner-arrow, .banner-line, .banner-date',
                opacity: [0, 1],
                translateX: [-20, 0],
                duration: 600,
                delay: anime.stagger(80, { start: 600 }),
                easing: 'easeOutExpo',
            });

            anime({
                targets: '.banner-logo, #sloganImg',
                opacity: [0, 1],
                translateY: [-10, 0],
                duration: 500,
                delay: anime.stagger(100, { start: 500 }),
                easing: 'easeOutQuad',
            });
        });
    </script>
