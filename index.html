<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방어진고등학교 방송부 BBS</title>
    <!-- AOS Animation CSS -->
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <style>
        @font-face {
            font-family: 'BEANPOLE_2020';
            src: url('https://cdn.jsdelivr.net/gh/wooin21/web/fonts/etc/BEANPOLE2020-Light.woff') format('woff');
            font-weight: normal;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'BEANPOLE_2020', sans-serif;
            overflow-x: hidden;
            background: url('background.png') center/cover no-repeat fixed;
            overflow-y: auto;
            margin: 0;
            padding: 0;
        }

        /* Main Box Container */
        .container {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            position: relative;
            width: 100%;
            max-width: 1920px;
            min-height: 85vh;
            margin: 0 auto;
            box-sizing: border-box;
        }

        /* header bar using flex */
        .header-bar {
            position: fixed;
            top: 0;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            padding: 8px 2%;
            box-sizing: border-box;
            z-index: 20;
            max-width: 1920px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
            border-radius: 0 0 2vw 2vw;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.1),
                inset 0 1px 0 rgba(255, 255, 255, 0.4);
            overflow: hidden;
        }

        .header-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, 
                transparent 0%,
                rgba(255, 255, 255, 0.6) 50%,
                transparent 100%);
            pointer-events: none;
        }

        .header-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 1px;
            height: 100%;
            background: linear-gradient(180deg, 
                rgba(255, 255, 255, 0.6) 0%,
                transparent 40%,
                rgba(255, 255, 255, 0.1) 100%);
            pointer-events: none;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(6px) saturate(160%) contrast(1.15);
            -webkit-backdrop-filter: blur(6px) saturate(160%) contrast(1.15);
            padding: 10px 20px;
            border-radius: 90px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .logo {
            width: 80px;
            height: auto;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 3px;
            margin-bottom: 4px;
        }

        .logo svg {
            width: 100%;
            height: 100%;
        }

        .subtitle {
            padding-top: 3.5%;
            padding-right: 2%;
            font-size: clamp(14px, 1.2vw, 20px);
            font-weight: 500;
            color: white;
            white-space: nowrap;
        }

        .nav {
            display: flex;
            align-items: center;
            justify-content: space-around;
            gap: 8px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(6px) saturate(160%) contrast(1.15);
            -webkit-backdrop-filter: blur(6px) saturate(160%) contrast(1.15);
            padding: 6px 10px;
            border-radius: 90px;
            min-width: 240px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .nav button {
            background: none;
            border: none;
            color: white;
            font-size: clamp(14px, 1.8vw, 28px);
            font-family: 'BEANPOLE_2020', sans-serif;
            cursor: pointer;
            transition: opacity 0.3s;
            padding: 6px 8px;
        }

        .nav button:hover {
            opacity: 0.8;
        }

        .nav button:active {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0.98);
        }

        .main-c1{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 80vh;
            padding-top: 2vh;
            position: relative;
        }

        .main-box {
            position: relative;
            margin: 6vh auto 0;
            width: 95%;
            max-width: 1820px;
            height: 70vh;
            min-height: 420px;
            border-radius: 6.8vw;
            background: linear-gradient(180deg, #4a82c3 0%, #5f4397 100%);
            overflow: hidden;
        }

        .main-box video {
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: inherit;
            z-index: 1;
            pointer-events: none;
            display: block;
            /* 동영상을 살짝 어둡게 처리해서 위 텍스트 가독성 향상 */
            filter: brightness(0.8) contrast(1.05);
        }



        .main-text {           
            position: absolute;
            left: 6%;
            right: 6%;
            bottom: 6%;
            color: white;
            z-index: 10;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 30px;
            width: auto;
        }

        .main-text-content {
            display: flex;
            flex-direction: column;
            flex: 1;
            min-width: 0;
        }

        .main-text p {
            font-size: clamp(28px, 6vw, 96px);
            line-height: 1.02;
            margin: 0;
            word-break: keep-all;
            white-space: normal;
        }

        .main-buttons {
            display: flex;
            gap: 12px;
            flex-direction: column;
            flex-shrink: 0;
            margin-right: auto;
            margin-left: 30px;
        }

        .main-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            height: 5.5vh;
            min-height: 48px;
            max-height: 65px;
            padding: 0 28px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.28);
            /* 기존 컬러를 살리되 더 투명하게, 밝은 느낌으로 */
            background:
                linear-gradient(135deg, rgba(111, 168, 232, 0.92) 0%, rgba(95, 67, 151, 0.92) 100%);
            box-shadow:
                0 14px 35px rgba(79, 67, 151, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.55);
            color: #f5f7ff;
            font-size: clamp(14px, 1.6vw, 18px);
            font-family: 'Pretendard', sans-serif;
            font-weight: 600;
            letter-spacing: 0.03em;
            cursor: pointer;
            transition: transform 0.2s ease-out, box-shadow 0.25s ease-out, background 0.25s ease-out;
            white-space: nowrap;
            position: relative;
            overflow: hidden;
        }

        .main-btn::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 0% 0%, rgba(255, 255, 255, 0.45), transparent 55%);
            opacity: 0.0;
            transition: opacity 0.25s ease-out, transform 0.25s ease-out;
            transform: translate3d(-10%, -20%, 0) scale(1.1);
            pointer-events: none;
        }

        .main-btn span {
            position: relative;
            z-index: 1;
        }

        .main-btn::after {
            content: '↗';
            position: relative;
            z-index: 1;
            font-size: 1.1em;
            transition: transform 0.22s ease-out, opacity 0.22s ease-out;
            opacity: 0.8;
        }

        .main-btn:hover {
            transform: translateY(-2px) scale(1.02);
            box-shadow:
                0 18px 45px rgba(79, 67, 151, 0.58),
                0 0 0 1px rgba(130, 173, 255, 0.7);
            background:
                linear-gradient(135deg, rgba(140, 190, 255, 0.98) 0%, rgba(183, 122, 255, 0.98) 100%);
        }

        .main-btn:hover::before {
            opacity: 0.5;
            transform: translate3d(0, 0, 0) scale(1);
        }

        .main-btn:hover::after {
            transform: translateX(4px) translateY(-2px);
            opacity: 1;
        }

        .main-btn:active {
            transform: translateY(0);
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.6),
                0 0 0 1px rgba(130, 173, 255, 0.5);
        }

        .main-text .bold {
            font-weight: 700;
        }

        .arrow-right {
            position: absolute;
            right: 40px;
            top: 15%;
            transform: translateY(-50%);
            width: 38px;
            height: auto;
            cursor: pointer;
            transition: transform 0.3s ease;
            z-index: 10;
        }

        .arrow-right:hover {
            transform: translateY(-50%) scale(1.1);
        }

        .arrow-left {
            position: absolute;
            left: 40px;
            top: 96%;
            transform: translateY(-50%);
            width: 36px;
            height: auto;
            cursor: pointer;
            transition: transform 0.3s ease;
            z-index: 10;
        }

        .arrow-left:hover {
            transform: translateY(-50%) scale(1.1);
        }

        .footer-overlay {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            min-height: 12vh;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            padding: 40px 5%;
            gap: 40px;
            box-sizing: border-box;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn {
            display: inline-flex;
            flex-direction: row;
            height: 5.5vh;
            min-height: 48px;
            border-radius: 50px;
            background: linear-gradient(135deg, #6fa8e8 0%, #5f4397 100%);
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            padding: 0 20px;
            box-shadow: 0 8px 20px rgba(79, 67, 151, 0.3);
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(79, 67, 151, 0.5);
            background: linear-gradient(135deg, #7eb4f0 0%, #6f53a7 100%);
        }

        .btn-apply, .btn-youtube {
            position: relative;
            width: auto;
            min-width: 160px;
        }

        .btn span {
            color: white;
            font-size: clamp(14px, 1.8vw, 18px);
            font-weight: 700;
        }

        .footer-btn {
            display: flex;
            flex-direction: row;
            gap: 15px;
            flex-shrink: 0;
        }

        .footer-info {
            display: flex;
            flex-direction: column;
            position: relative;
            color: white;
            font-family: 'Pretendard', sans-serif;
        }

        .footer-info .title {
            font-size: clamp(18px, 2vw, 24px);
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
            font-family: 'BEANPOLE_2020', sans-serif;
        }

        .footer-info .address {
            font-size: clamp(14px, 1.5vw, 16px);
            font-weight: 500;
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.5;
        }

        .footer-family {
            display: flex;
            align-items: center;
            flex-shrink: 0;
            margin-left: auto;
        }

        .family-select {
            padding: 10px 16px;
            font-size: clamp(12px, 1.2vw, 14px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            font-family: 'Pretendard', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            min-width: 140px;
        }

        .family-select:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.5);
        }

        .family-select:focus {
            outline: none;
            background: rgba(255, 255, 255, 0.15);
            border-color: #6fa8e8;
        }

        .family-select option {
            background: #1a1a1a;
            color: white;
            padding: 8px;
        }

        /* Popup Modal */
        .popup-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .popup-overlay.active {
            display: flex;
        }

        .popup-content {
            position: relative;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 90%;
            animation: popupSlideIn 0.3s ease-out;
            overflow: hidden;
        }

        @keyframes popupSlideIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .popup-image {
            width: 100%;
            height: auto;
            display: block;
        }

        .popup-footer {
            padding: 20px;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            flex-wrap: wrap;
        }

        .popup-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            color: #333;
            font-family: 'Pretendard', sans-serif;
            cursor: pointer;
            flex: 1;
            min-width: 150px;
        }

        .popup-checkbox input {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }

        .popup-close-btn {
            background: linear-gradient(135deg, #6fa8e8 0%, #5f4397 100%);
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 700;
            font-family: 'Pretendard', sans-serif;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .popup-close-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(79, 67, 151, 0.4);
        }

        /* Mobile Navigation Toggle */
        .hamburger {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            cursor: pointer;
            z-index: 30;
            transition: transform 0.3s ease;
            padding: 8px 12px;
        }

        .hamburger:hover {
            transform: scale(1.1);
        }

        /* Nav active state with animation */
        .nav {
            transition: all 0.3s ease;
        }

        .nav.active {
            display: flex;
            animation: slideDown 0.3s ease forwards;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(-20px);
            }
        }

        .nav button {
            transition: all 0.2s ease;
        }

        .nav button:active {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(0.98);
        }

        /* YouTube RSS Container Styles */
        .youtube-container {
            width: 100%;
            padding: 40px 3%;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.1) 0%, rgba(0, 0, 0, 0.2) 100%);
        }

        .youtube-title {
            font-size: clamp(24px, 4vw, 48px);
            color: white;
            margin-bottom: 30px;
            text-align: center;
            font-weight: 600;
        }

        .youtube-wrapper {
            max-width: 1820px;
            margin: 0 auto;
            position: relative;
        }

        .video-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        @media (min-width: 1921px) {
            .youtube-wrapper {
                position: relative;
            }

            .video-grid {
                display: flex;
                gap: 20px;
                overflow-x: auto;
                scroll-behavior: smooth;
                padding: 10px 0;
                scroll-padding: 10px;
                cursor: grab;
                scroll-snap-type: x mandatory;
                user-select: none;
            }

            .video-grid.dragging {
                scroll-behavior: auto;
                cursor: grabbing;
            }

            .video-grid::-webkit-scrollbar {
                display: none;
            }

            .video-card {
                flex: 0 0 280px;
            }

            .slide-btn {
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                background: rgba(255, 255, 255, 0.2);
                border: none;
                color: white;
                width: 50px;
                height: 50px;
                border-radius: 50%;
                cursor: pointer;
                font-size: 24px;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.3s ease;
                z-index: 10;
            }

            .slide-btn:hover {
                background: rgba(255, 255, 255, 0.4);
                transform: translateY(-50%) scale(1.1);
            }

            .slide-btn.prev {
                left: -30px;
            }

            .slide-btn.next {
                right: -30px;
            }
        }

        .video-card {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .video-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .video-thumbnail {
            width: 100%;
            height: 160px;
            background: #000;
            object-fit: cover;
            display: block;
            pointer-events: none;
            user-select: none;
            -webkit-user-drag: none;
        }

        .video-info {
            padding: 15px;
            color: white;
        }

        .video-title {
            font-size: 14px;
            font-weight: 600;
            margin: 0 0 10px 0;
            line-height: 1.4;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            font-family: 'Pretendard', sans-serif;
        }

        .video-date {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.6);
            margin: 0;
            font-family: 'Pretendard', sans-serif;
        }

        .loading-spinner {
            text-align: center;
            color: white;
            padding: 40px;
            font-size: 18px;
        }

        .loading-spinner::after {
            content: '';
            display: inline-block;
            width: 20px;
            height: 20px;
            margin-left: 10px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* BBS Introduction Container - Fullscreen, Large Layout */
        .bbs-intro-container {
            width: 100%;
            min-height: 100vh;
            padding: 120px 5% 120px;
            background: linear-gradient(180deg, rgba(20, 20, 20, 0.9) 0%, rgba(10, 10, 10, 0.95) 100%);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .bbs-intro-content {
            width: 100%;
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1.1fr 1fr;
            gap: 80px;
            align-items: center;
        }

        .bbs-intro-image {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .bbs-star-image {
            width: 100%;
            max-width: 440px;
            height: auto;
            object-fit: contain;
            filter: drop-shadow(0 0 30px rgba(111, 168, 232, 0.3));
        }

        .bbs-intro-text-wrapper {
            display: flex;
            flex-direction: column;
            gap: 26px;
        }

        .bbs-intro-title {
            font-size: clamp(36px, 5vw, 68px);
            color: white;
            font-weight: 700;
            letter-spacing: 0.5px;
            font-family: 'BEANPOLE_2020', sans-serif;
            margin: 0;
            line-height: 1.18;
        }

        .bbs-intro-text {
            font-size: clamp(16px, 1.9vw, 22px);
            color: rgba(255, 255, 255, 0.88);
            line-height: 1.9;
            font-family: 'Pretendard', sans-serif;
            margin: 0;
            letter-spacing: 0.02em;
        }

        .bbs-asterisk {
            color: #6fa8e8;
            font-weight: 600;
        }

        .bbs-equipment-note {
            font-size: clamp(11px, 1.2vw, 14px);
            color: rgba(255, 255, 255, 0.6);
            line-height: 1.6;
            font-family: 'Pretendard', sans-serif;
            margin: 0;
            margin-top: 10px;
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .bbs-note-asterisk {
            color: #6fa8e8;
            font-weight: 600;
        }

        /* Department Container Styles */
        .department-container {
            width: 100%;
            padding: 60px 3%;
            background: #0f0f0f;
        }

        .department-title {
            font-size: clamp(24px, 4vw, 48px);
            color: white;
            margin-bottom: 50px;
            text-align: left;
            font-weight: 600;
            max-width: 1820px;
            margin: 0 auto 50px auto;
        }

        .department-grid {
            max-width: 1820px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 20px;
            perspective: 1000px;
        }

        .department-card {
            background: linear-gradient(135deg, rgba(111, 168, 232, 0.08) 0%, rgba(95, 67, 151, 0.08) 100%);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 40px 30px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
            min-height: 200px;
            cursor: pointer;
        }

        .department-grid .department-card:hover {
            opacity: 1;
        }

        .department-grid:has(.department-card:hover) .department-card:not(:hover) {
            opacity: 0.4;
            filter: blur(2px);
        }

        .department-card:hover {

            <div class="footer-info">
                <div class="title">방어진고등학교 방송부</div>
                <div class="address">울산광역시 동구 학문로 50 (우 : 44054) 2층</div>
            </div>

            <!-- Family Sites -->
            <div class="footer-family">
                <select class="family-select" onchange="handleFamilySite(this.value)">
                    <option value="">패밀리 사이트</option>
                    <option value="https://school.use.go.kr/bangeojin-h/M01">방어진고등학교</option>
                </select>
            </div>
        </footer>
    </div>

    <!-- AOS Animation JS -->
    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>

    <script>
        // 부서 데이터 (이 배열에서 쉽게 추가/수정/삭제 가능)
        const departments = [
            {
                name: '미디어 에디터',
                icon: '🎬',
                description: '영상 촬영과 편집을 통해 방송부의 영상 활동을 주도합니다.'
            },
            {
                name: '컴퓨터 엔지니어',
                icon: '💻',
                description: '방송 송출과 기술 운영을 담당합니다. 안정적인 방송 환경을 운영하며 컴퓨터를 관리합니다.'
            },
            {
                name: '음향 엔지니어',
                icon: '🎧',
                description: '믹서, 마이크, 오인페, 스피커등을 다루며 학교 행사에서 음향을 책임집니다.'
            },
            {
                name: '디자이너',
                icon: '🎨',
                description: '시각적 디자인과 그래픽을 담당합니다. 포스터 제작, 부원증 제작, 썸네일 제작 등 다양한 디자인 작업을 수행합니다.'
            },
            {
                name: '작가',
                icon: '✍️',
                description: '시나리오 라이팅과 연출을 담당합니다. 재미있고 창의적인 대본으로 컨텐츠에 핵심적인 역할을 수행합니다.'
            }
        ];

        function renderDepartments() {
            const departmentGrid = document.getElementById('departmentGrid');
            departmentGrid.innerHTML = '';
            
            departments.forEach(dept => {
                const departmentCard = document.createElement('div');
                departmentCard.className = 'department-card';
                // 각 부서 카드에 AOS 애니메이션 추가
                departmentCard.setAttribute('data-aos', 'fade-up');
                departmentCard.setAttribute('data-aos-duration', '800');
                departmentCard.innerHTML = `
                    <div class="department-icon">${dept.icon}</div>
                    <h3 class="department-name">${dept.name}</h3>
                    <p class="department-description">${dept.description}</p>
                `;
                
                departmentGrid.appendChild(departmentCard);
            });
        }

        function toggleMenu() {
            const nav = document.querySelector('.nav');
            const hamburger = document.querySelector('.hamburger');
            
            if (nav.classList.contains('active')) {
                // 메뉴 닫기 애니메이션
                nav.style.animation = 'slideUp 0.3s ease forwards';
                setTimeout(() => {
                    nav.classList.remove('active');
                    nav.style.animation = '';
                }, 300);
            } else {
                // 메뉴 열기 애니메이션
                nav.classList.add('active');
                nav.style.animation = 'slideDown 0.3s ease forwards';
            }
        }

        // 드래그 기능 (마우스 + 터치 지원)
        let isDown = false;
        let startX;
        let scrollLeft;
        let isDragged = false;

        const videoGrid = document.getElementById('videoGrid');

        function onDragStart(e) {
            isDown = true;
            isDragged = false;
            videoGrid.classList.add('dragging');
            startX = (e.pageX || e.touches[0].pageX) - videoGrid.offsetLeft;
            scrollLeft = videoGrid.scrollLeft;
        }

        function onDragEnd() {
            isDown = false;
            videoGrid.classList.remove('dragging');
        }

        function onDrag(e) {
            if (!isDown) return;
            e.preventDefault();
            const x = (e.pageX || e.touches[0].pageX) - videoGrid.offsetLeft;
            const walk = (x - startX) * 1.5; // 드래그 민감도
            if (Math.abs(walk) > 5) {
                isDragged = true; // 5px 이상 이동하면 드래그로 판단
            }
            videoGrid.scrollLeft = scrollLeft - walk;
        }

        // 마우스 이벤트
        videoGrid.addEventListener('mousedown', onDragStart);
        videoGrid.addEventListener('mouseleave', onDragEnd);
        videoGrid.addEventListener('mouseup', onDragEnd);
        videoGrid.addEventListener('mousemove', onDrag);

        // 터치 이벤트 (모바일/태블릿)
        videoGrid.addEventListener('touchstart', onDragStart);
        videoGrid.addEventListener('touchend', onDragEnd);
        videoGrid.addEventListener('touchmove', onDrag);

        // 드래그 후 클릭 방지
        document.querySelectorAll('.video-card').forEach(card => {
            card.addEventListener('click', function(e) {
                if (isDragged) {
                    e.preventDefault();
                    e.stopPropagation();
                    return false;
                }
            }, true);
        });

        // 메뉴 항목 클릭시 메뉴 닫기 (애니메이션 포함)
        document.querySelectorAll('.nav button').forEach(button => {
            button.addEventListener('click', function() {
                const nav = document.querySelector('.nav');
                nav.style.animation = 'slideUp 0.3s ease forwards';
                setTimeout(() => {
                    nav.classList.remove('active');
                    nav.style.animation = '';
                }, 300);
            });
        });

        // 화면 크기 변경시 메뉴 상태 초기화
        window.addEventListener('resize', function() {
            if (window.innerWidth > 768) {
                const nav = document.querySelector('.nav');
                nav.classList.remove('active');
                nav.style.animation = '';
            }
        });

        function handleNav(section) {
            // 메뉴 닫기
            const nav = document.querySelector('.nav');
            if (nav.classList.contains('active')) {
                nav.classList.remove('active');
            }
            
            if (section === '소개') {
                // 부서 소개 컨테이너로 스크롤
                const introSection = document.getElementById('introduction');
                if (introSection) {
                    introSection.scrollIntoView({ behavior: 'smooth' });
                }
            } else if (section === '유튜브') {
                // YouTube 채널로 이동 (URL은 필요에 따라 수정)
                window.open('https://www.youtube.com/channel/UCzaRFkwvHRieGLq65cuXAjA', '_blank');
            } else if (section === '방어진고등학교') {
                // 방어진고등학교 웹사이트로 이동 (URL은 필요에 따라 수정)
                window.open('https://school.use.go.kr/bangeojin-h/M01', '_blank');
            }
        }

        function handleApply() {
            alert('지원 기간이 아닙니다.');
            // window.location.href = '지원 페이지 URL';
        }

        function handleYoutube() {
            window.open('https://www.youtube.com/channel/UCzaRFkwvHRieGLq65cuXAjA', '_blank');
        }

        function handleFamilySite(url) {
            if (url) {
                window.open(url, '_blank');
                // 선택 초기화
                document.querySelector('.family-select').value = '';
            }
        }

        // 팝업 관련 함수
        // 팝업 표시 여부를 결정하는 설정 (true = 표시, false = 표시 안함)
        const SHOW_POPUP = true; // 팝업 활성화/비활성화

        function showPopup() {
            // 팝업이 비활성화되었으면 표시하지 않음
            if (!SHOW_POPUP) return;

            // 오늘 하루 안보기 설정 확인
            const today = new Date().toDateString();
            const dontShowToday = localStorage.getItem('popupDontShowToday');
            
            if (dontShowToday === today) {
                return; // 오늘 이미 안본다고 설정했으면 표시하지 않음
            }

            const popupOverlay = document.getElementById('popupOverlay');
            popupOverlay.classList.add('active');
        }

        function closePopup() {
            const popupOverlay = document.getElementById('popupOverlay');
            const dontShowCheckbox = document.getElementById('dontShowToday');
            
            // 오늘 하루 안보기 체크 여부 확인
            if (dontShowCheckbox.checked) {
                const today = new Date().toDateString();
                localStorage.setItem('popupDontShowToday', today);
            }

            popupOverlay.classList.remove('active');
        }

        // 오버레이 클릭 시 팝업 닫기
        document.addEventListener('DOMContentLoaded', function() {
            const popupOverlay = document.getElementById('popupOverlay');
            if (popupOverlay) {
                popupOverlay.addEventListener('click', function(e) {
                    if (e.target === popupOverlay) {
                        closePopup();
                    }
                });
            }
            
            // 페이지 로드 시 팝업 표시
            showPopup();

            // AOS 초기화
            if (window.AOS) {
                AOS.init({
                    once: true,           // 한 번만 애니메이션
                    offset: 80,          // 트리거 오프셋
                    duration: 700,       // 기본 지속시간
                    easing: 'ease-out'   // 기본 이징
                });
            }
        });

        // 슬라이드 함수
        function slideVideos(direction) {
            const videoGrid = document.getElementById('videoGrid');
            const scrollAmount = 320; // 카드 너비(280px) + 갭(20px) + 여유
            
            if (direction === 'next') {
                videoGrid.scrollLeft += scrollAmount;
            } else {
                videoGrid.scrollLeft -= scrollAmount;
            }
        }

        // YouTube RSS Loader
        async function loadYouTubeVideos() {
            try {
                // YouTube 채널 ID (여기에 유튜브 채널 ID를 입력하세요)
                const YOUTUBE_CHANNEL_ID = 'UCzaRFkwvHRieGLq65cuXAjA'; // Google Developers 채널 (예시)
                const RSS_URL = `https://www.youtube.com/feeds/videos.xml?channel_id=${YOUTUBE_CHANNEL_ID}`;
                
                // rss2json API를 사용하여 RSS를 JSON으로 변환
                const API_URL = `https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(RSS_URL)}`;
                
                const response = await fetch(API_URL);
                const data = await response.json();
                
                if (data.items && data.items.length > 0) {
                    displayVideos(data.items.slice(0, 12)); // 최신 12개만 표시
                } else {
                    showError('영상을 찾을 수 없습니다.');
                }
            } catch (error) {
                console.error('Error loading videos:', error);
                showError('영상을 불러올 수 없습니다.');
            }
        }

        function displayVideos(items) {
            const videoGrid = document.getElementById('videoGrid');
            videoGrid.innerHTML = '';
            
            items.forEach(item => {
                // YouTube 영상 URL과 섬네일 추출
                const videoId = extractVideoId(item.link);
                const thumbnail = `https://img.youtube.com/vi/${videoId}/mqdefault.jpg`;
                const title = item.title;
                const pubDate = new Date(item.pubDate).toLocaleDateString('ko-KR');
                
                const videoCard = document.createElement('div');
                videoCard.className = 'video-card';
                videoCard.onclick = () => window.open(item.link, '_blank');
                
                videoCard.innerHTML = `
                    <img src="${thumbnail}" alt="${title}" class="video-thumbnail">
                    <div class="video-info">
                        <h3 class="video-title">${title}</h3>
                        <p class="video-date">${pubDate}</p>
                    </div>
                `;
                
                videoGrid.appendChild(videoCard);
            });
        }

        function extractVideoId(url) {
            // YouTube URL에서 비디오 ID 추출
            const match = url.match(/v=([a-zA-Z0-9_-]{11})/);
            return match ? match[1] : '';
        }

        function showError(message) {
            const videoGrid = document.getElementById('videoGrid');
            videoGrid.innerHTML = `<div style="color: #ff6b6b; grid-column: 1/-1; text-align: center; padding: 40px;">${message}</div>`;
        }

        // 페이지 로드 시 영상과 부서 정보 불러오기
        document.addEventListener('DOMContentLoaded', function() {
            loadYouTubeVideos();
            renderDepartments();
        });
    </script>
</body>
</html>
